[project]
name = "asksback"
version = "0.1.0"
description = "AsksBack worker: reads scanned exams, grades them, and runs dynamic-assessment follow-ups."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "opencv-python>=4.10",
    "pillow>=10.4",
    "pydantic>=2.8",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["asksback"]

[tool.pytest.ini_options]
testpaths = ["tests"]
