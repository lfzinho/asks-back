[project]
name = "asksback"
version = "0.1.0"
description = "AsksBack worker: reads scanned exams, grades them, and runs dynamic-assessment follow-ups."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "opencv-python>=4.10",
    "pillow>=10.4",
    "pydantic>=2.8",
    "pypdfium2>=5.14.0",
    "pyyaml>=6.0",
    "rapidocr-onnxruntime>=1.4.4",
    "anthropic>=0.70",
    "google-cloud-firestore>=2.34.1",
    "google-cloud-storage>=3.17.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["asksback"]

[tool.pytest.ini_options]
testpaths = ["tests"]
